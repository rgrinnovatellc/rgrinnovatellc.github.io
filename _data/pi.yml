# Current Projects (identical to the resume's Research Highlights; bullets verbatim)
current_projects:
  - name: "ZeroDown: on-the-fly eBPF security-policy updates for microcontrollers"
    status: "In preparation, IEEE IoT-J"
    bullets:
      - "Idea: the device's owner writes its security policy as one versioned YAML file — the rules, exceptions for particular peers, and the name of the eBPF program that decides each event — so a change means editing the file, not the firmware"
      - "Built the system that installs a new policy file on a Bluetooth Low Energy (BLE) device and activates it without a reboot, instead of waiting months for a firmware update and a restart"
      - "In hardware tests, all 72 updates applied without a reset, taking a median 2.8 s; in a separate 60-update test with a peer connected, the connection never dropped and the device's notifications to the peer paused for a median 2.5 s"
      - "Designed the update process: authenticated delivery, crash-consistent storage in two flash slots, and a confirmation step — the device keeps a new policy only if the owner reconnects and confirms it, and reverts it otherwise"
      - "Protected against bad updates: in all 7 tests with a corrupted or interrupted update, the existing policy stayed in place; and when a new policy locked the owner out, resetting the device restored the previous one in all 120 trials"
      - "Hardened the eBPF interpreter that runs the rules (step limit, memory checks, divide-by-zero fix): no crash in 146.9M host-side fuzzing executions; deciding one event takes about 0.3 ms"

  - name: "Android 17 JobScheduler: its reports of why jobs wait can be wrong while its scheduling is right"
    status: "Lost Boundaries (in preparation, IEEE TMC); Correct Decisions (under review, ACM HotMobile 2027)"
    artifact:
      label: "Artifact (GitHub)"
      url: "https://github.com/rgrinnovatellc/CorrectDecisions"
    bullets:
      - "Found that Android 17's report can show a job waiting longer than it has existed, and show a system policy (App Standby) holding the job longer than the app's own requested delay — pointing a developer at the wrong cause (30 of 30 qualifying emulator attempts)"
      - "Showed the reported wait shrinking by over 8 s while the job kept waiting — a decrease no correct count can produce (2 of 2 emulator boots)"
      - "Traced the cause: two wait conditions reported under one reason share one start time; the second to start waiting overwrites it, and the first to finish deletes it — so later waits are measured from the wrong moment, even from the job's creation"
      - "Proved that two different wait histories can leave identical stored data, so no change to the calculation alone can report both correctly"
      - "Explained why the error goes unnoticed: scheduling never reads the reported durations, so it stays correct, and none of the 7 upstream tests for this report checks the duration of a shared reason"
      - "Proposed a 4-part test format (property, history, observations, assertion) to catch such errors"
      - "Built a one-commit fix: on both repaired emulator images, neither the ranking reversal nor the reported decrease reappeared"

  - name: "AIE Verification: approving AI-written code and software releases"
    status: "In preparation, ACM TOSEM"
    bullets:
      - "Showed that AI-written tests can pass wrong code: in 25 constructed LLM coding tasks (Codex CLI), all passed their own tests, including 12 labeled flawed for following a prompt's wrong assumption"
      - "Wrote checks from the real requirement: they rejected all 12 flawed results and accepted the other 13"
      - "Defined 3 conditions for trusting an approval: it checks the real requirement, its inputs are controlled outside the build pipeline, and it applies to the exact file delivered"
      - "Built a release check in an Android app's release CI/CD pipeline: it rejected all 9 bad test inputs and accepted all 4 good ones"

  - name: "eBPF & HELOT: Linux kernel tracing and power-grid forensics"
    status: "Published"
    bullets:
      - "Co-authored a published method that removes the slowdown eBPF tracing imposes on untraced programs (ACM SIGCOMM eBPF workshop 2024)"
      - "Co-authored HELOT, a DOE-funded prototype that collects forensic evidence from power-substation devices without shutting them down (IEEE Trans. Smart Grid 2023)"
      - "Moved the pbtools message parser into a Linux kernel module; prototyped a message-filtering firewall (custom kfunc support and TC-based enforcement)"

  - name: "Meta Project Aria Gen 2 Research Partnership"
    status: "Principal Investigator, 2026 – Present"
    bullets:
      - "Lead the lab's Aria Gen 2 wearable-security research program and set its research directions"
      - "Serve as primary liaison with Meta Reality Labs Research"
      - "Collaborate on all Aria-based lab projects and publications"

